<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chance's Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080a0f;--surface:#0d1117;--border:#1c2333;--ink:#e8eaf0;--ink2:#6b7385;--ink3:#3a404f;}
html,body{width:100%;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Syne',sans-serif;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.6;}
body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:0;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 30%,transparent 100%);opacity:.4;}
.blob{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0;animation:blobDrift 14s ease-in-out infinite alternate;}
.blob-1{width:600px;height:500px;top:-100px;left:-150px;background:radial-gradient(circle,#1a2a6c44,transparent 70%);}
.blob-2{width:500px;height:400px;bottom:-80px;right:-100px;background:radial-gradient(circle,#4f8ef722,transparent 70%);animation-delay:-7s;}
.blob-3{width:350px;height:300px;top:40%;left:60%;background:radial-gradient(circle,#f7c94f11,transparent 70%);animation-delay:-3s;}
@keyframes blobDrift{from{transform:translate(0,0) scale(1);}to{transform:translate(30px,20px) scale(1.05);}}
.wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;gap:64px;}
header{text-align:center;}
.eyebrow{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--ink2);margin-bottom:20px;display:flex;align-items:center;gap:12px;justify-content:center;}
.eyebrow::before,.eyebrow::after{content:'';display:block;width:40px;height:1px;background:var(--border);}
.title{font-family:'Bebas Neue',sans-serif;font-size:clamp(72px,14vw,140px);line-height:.9;letter-spacing:.02em;color:var(--ink);display:inline-block;}
.title span{display:block;background:linear-gradient(135deg,#e8eaf0 30%,#6b7385 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.title .sub{font-family:'DM Mono',monospace;font-size:13px;font-weight:400;letter-spacing:.18em;-webkit-text-fill-color:var(--ink2);color:var(--ink2);background:none;margin-top:12px;display:block;text-transform:uppercase;}
.games{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
  width:100%;
  max-width:760px;
}
.search-wrap{
  width:100%;
  max-width:760px;
  position:relative;
}
.search-input{
  width:100%;
  padding:15px 18px 15px 46px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--surface);
  color:var(--ink);
  font-family:'DM Mono',monospace;
  font-size:11px;
  letter-spacing:.08em;
  outline:none;
  transition:border-color .2s ease,box-shadow .2s ease,background .2s ease;
}
.search-input::placeholder{
  color:var(--ink3);
  text-transform:uppercase;
}
.search-input:focus{
  border-color:#4f8ef755;
  box-shadow:0 0 0 3px #4f8ef711,0 8px 32px rgba(0,0,0,.35);
}
.search-icon{
  position:absolute;
  left:18px;
  top:50%;
  transform:translateY(-50%);
  color:var(--ink3);
  font-family:'DM Mono',monospace;
  font-size:13px;
  pointer-events:none;
}
.search-count{
  margin-top:8px;
  min-height:12px;
  font-family:'DM Mono',monospace;
  font-size:9px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--ink3);
  text-align:right;
}
.no-results{
  grid-column:1 / -1;
  border:1px solid var(--border);
  padding:28px;
  background:var(--surface);
  color:var(--ink3);
  font-family:'DM Mono',monospace;
  font-size:10px;
  letter-spacing:.12em;
  text-align:center;
  text-transform:uppercase;
}
.game-card{display:block;text-decoration:none;border:1px solid var(--border);border-radius:10px;padding:28px 32px;background:var(--surface);position:relative;overflow:hidden;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;cursor:pointer;animation:cardIn .6s cubic-bezier(.22,1,.36,1) both;}
@keyframes cardIn{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
.game-card::before{content:'';position:absolute;inset:0;background:var(--card-glow,transparent);opacity:0;transition:opacity .3s;border-radius:inherit;}
.game-card:hover::before{opacity:1;}
.game-card:hover{transform:translateY(-3px);box-shadow:0 12px 48px rgba(0,0,0,.5);border-color:var(--card-border,var(--border));}
.game-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--card-color,#fff),transparent);opacity:0;transition:opacity .3s;}
.game-card:hover::after{opacity:1;}
.card-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;position:relative;z-index:1;}
.card-left{flex:1;}
.card-num{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px;display:block;color:var(--card-color,var(--ink2));}
.card-name{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:.04em;color:var(--ink);line-height:1;display:block;margin-bottom:6px;}
.card-desc{font-family:'DM Mono',monospace;font-size:10px;color:var(--ink2);letter-spacing:.08em;line-height:1.6;text-transform:uppercase;}
.card-arrow{font-size:28px;flex-shrink:0;color:var(--card-color,var(--ink2));transition:transform .25s cubic-bezier(.22,1,.36,1);}
.game-card:hover .card-arrow{transform:translate(4px,-4px);}
.scanline{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,.012) 3px,rgba(255,255,255,.012) 4px);pointer-events:none;border-radius:inherit;opacity:0;transition:opacity .3s;}
.game-card:hover .scanline{opacity:1;}
footer{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);display:flex;align-items:center;gap:16px;}
footer::before,footer::after{content:'';display:block;width:32px;height:1px;background:var(--ink3);opacity:.4;}
.corner{position:fixed;width:48px;height:48px;pointer-events:none;z-index:2;}
.corner-tl{top:20px;left:20px;border-top:1px solid var(--border);border-left:1px solid var(--border);}
.corner-tr{top:20px;right:20px;border-top:1px solid var(--border);border-right:1px solid var(--border);}
.corner-bl{bottom:20px;left:20px;border-bottom:1px solid var(--border);border-left:1px solid var(--border);}
.corner-br{bottom:20px;right:20px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);}
.status{position:fixed;bottom:24px;right:24px;z-index:2;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);display:flex;align-items:center;gap:6px;}
.status-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

.download-btn{position:fixed;bottom:24px;left:24px;z-index:2;display:flex;align-items:center;gap:8px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink2);text-decoration:none;border:1px solid var(--border);border-radius:8px;padding:10px 16px;background:var(--surface);transition:transform .2s ease,border-color .2s ease,color .2s ease,box-shadow .2s ease;animation:cardIn .6s cubic-bezier(.22,1,.36,1) .5s both;}
.download-btn:hover{color:var(--ink);border-color:#4f8ef755;box-shadow:0 8px 32px rgba(0,0,0,.5);transform:translateY(-2px);}
.download-btn:active{transform:translateY(0);}
.download-btn svg{width:12px;height:12px;flex-shrink:0;}

@media(max-width:650px){
  .games{
    grid-template-columns:1fr;
    max-width:560px;
  }
  .search-wrap{
    max-width:560px;
  }
}

@media(max-width:500px){
  .wrap{
    padding:40px 16px;
    gap:36px;
  }
  .game-card{
    padding:22px 24px;
  }
}

/* ── disabled card state ── */
.game-card.is-disabled{cursor:not-allowed;opacity:.5;filter:grayscale(.6);}
.game-card.is-disabled:hover{transform:none;box-shadow:none;border-color:var(--border);}
.game-card.is-disabled:hover::before,
.game-card.is-disabled:hover::after,
.game-card.is-disabled:hover .scanline{opacity:0;}
.game-card.is-disabled:hover .card-arrow{transform:none;}
.card-reason{font-family:'DM Mono',monospace;font-size:10px;color:#f74f4f;letter-spacing:.08em;line-height:1.6;text-transform:uppercase;margin-top:6px;display:block;}
.card-arrow.is-locked{font-size:22px;}

/* ── sparkle card (casino green) ── */
.game-card.is-sparkle{
  border-color:#00c85344;
  background:linear-gradient(135deg,#00c85312,var(--surface) 60%);
  box-shadow:0 0 28px #00c8531a,inset 0 0 24px #00c85308;
}
.game-card.is-sparkle:hover{
  border-color:#00e676aa;
  box-shadow:0 12px 48px rgba(0,0,0,.5),0 0 40px #00e67633;
}
.game-card.is-sparkle .card-name{
  background:linear-gradient(100deg,#00c853 20%,#d4ffe4 45%,#00e676 55%,#00c853 80%);
  background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  animation:shimmer 3.5s linear infinite;
}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
.sparkle{
  position:absolute;z-index:0;left:var(--x);top:var(--y);
  font-size:var(--s);line-height:1;color:#c8ffdc;
  text-shadow:0 0 6px #00e676,0 0 14px #00c853;
  pointer-events:none;opacity:0;
  animation:twinkle var(--d) ease-in-out var(--delay) infinite;
}
@keyframes twinkle{
  0%,100%{opacity:0;transform:scale(0) rotate(0deg)}
  50%{opacity:1;transform:scale(1) rotate(90deg)}
}
.game-card.is-sparkle:hover .sparkle{animation-duration:calc(var(--d) * .6)}
@media(prefers-reduced-motion:reduce){
  .sparkle{animation:none;opacity:.5;transform:scale(.8)}
  .game-card.is-sparkle .card-name{animation:none}
}

/* ── per-card effects ── */
.fx{position:absolute;z-index:0;pointer-events:none}
.game-card:hover .fx{animation-duration:calc(var(--d,3s) * .65)}

/* Circulate: orbiting balls + bullets */
.orb{right:42px;top:calc(50% - 4px);width:8px;height:8px;border-radius:50%;background:#4f8ef7;box-shadow:0 0 8px #4f8ef7;animation:orbit var(--d) linear var(--delay) infinite}
@keyframes orbit{from{transform:rotate(0deg) translateX(var(--r))}to{transform:rotate(360deg) translateX(var(--r))}}
.bul{left:-4%;width:5px;height:5px;border-radius:50%;background:#9cc2ff;box-shadow:0 0 6px #4f8ef7;opacity:.8;animation:bullet var(--d) linear var(--delay) infinite}
@keyframes bullet{from{left:-4%}to{left:104%}}

/* Hold The Line: enemies march into the defence line */
.tdline{left:11%;top:0;bottom:0;width:0;border-left:1px dashed #ffffff55;animation:linepulse 2s ease-in-out infinite}
@keyframes linepulse{50%{border-left-color:#ffffffcc}}
.pip{width:5px;height:5px;background:#fff;box-shadow:0 0 6px #fff;animation:march var(--d) linear var(--delay) infinite}
@keyframes march{0%{left:104%;opacity:.9;transform:scale(1)}72%{left:12%;opacity:.9;transform:scale(1)}80%{left:11%;opacity:0;transform:scale(3)}100%{left:11%;opacity:0}}

/* MiniCord: chat bubbles floating up */
.bub{bottom:-18px;width:var(--w);height:14px;border-radius:9px 9px 9px 2px;background:#7a56e0;opacity:0;animation:rise var(--d) ease-out var(--delay) infinite}
.bub:nth-child(even){border-radius:9px 9px 2px 9px;background:#5534b2}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.55}100%{transform:translateY(-150px);opacity:0}}

/* MiniTube: video progress bar + play ripple */
.tbar{left:0;bottom:0;height:3px;width:0;background:#ff2a2a;box-shadow:0 0 8px #f00;animation:prog 4s linear infinite}
@keyframes prog{from{width:0}to{width:100%}}
.trip{right:32px;top:calc(50% - 14px);width:28px;height:28px;border-radius:50%;border:2px solid #ff3b3b;opacity:0;animation:ripple var(--d) ease-out var(--delay) infinite}
@keyframes ripple{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.6);opacity:0}}

/* Stellar Drift: drifting starfield + shooting star */
.star{left:104%;width:var(--z);height:var(--z);border-radius:50%;background:#ffe9a8;box-shadow:0 0 4px #fac637;animation:drift var(--d) linear var(--delay) infinite}
@keyframes drift{from{left:104%}to{left:-4%}}
.shoot{width:70px;height:2px;background:linear-gradient(90deg,#fff,#fac63700);opacity:0;animation:shoot 5s ease-in var(--delay) infinite}
@keyframes shoot{0%{transform:translate(0,0) rotate(-24deg);opacity:0}4%{opacity:1}22%,100%{transform:translate(-220px,100px) rotate(-24deg);opacity:0}}

/* Roguelike: rising embers + torch flicker */
.emb{bottom:-6px;width:4px;height:4px;border-radius:50%;background:#ff6a2b;box-shadow:0 0 6px #ff3d00;opacity:0;animation:ember var(--d) ease-out var(--delay) infinite}
@keyframes ember{0%{transform:translate(0,0) scale(1);opacity:0}15%{opacity:1}100%{transform:translate(var(--sx),-120px) scale(.3);opacity:0}}
.game-card.fx-ember{border-color:#8b000066;animation:cardIn .6s cubic-bezier(.22,1,.36,1) both,torch 2.6s ease-in-out infinite}
@keyframes torch{
  0%,100%{box-shadow:0 0 18px #8b000022,inset 0 0 28px #8b000022}
  30%{box-shadow:0 0 26px #8b000044,inset 0 0 40px #8b000044}
  55%{box-shadow:0 0 14px #8b000018,inset 0 0 22px #8b000018}
  75%{box-shadow:0 0 30px #8b000050,inset 0 0 44px #8b000050}
}

/* Hold The Line v2: turrets shoot enemies marching down lanes */
.tdline{left:11%;top:0;bottom:0;width:0;border-left:1px dashed #ffffff55;animation:linepulse 2s ease-in-out infinite}
.twr{left:13%;width:10px;height:10px;margin-top:-5px;border:1.5px solid #fff;border-radius:2px;transform:rotate(45deg);box-shadow:0 0 6px #ffffff88;animation:twrfire var(--d) linear var(--delay) infinite}
@keyframes twrfire{0%,58%{box-shadow:0 0 6px #ffffff88;background:transparent}62%{box-shadow:0 0 16px #fff;background:#fff}70%,100%{box-shadow:0 0 6px #ffffff88;background:transparent}}
.foe{width:7px;height:7px;margin-top:-3.5px;border-radius:1px;background:#ff6b5e;box-shadow:0 0 7px #ff3b2e;animation:foe var(--d) linear var(--delay) infinite}
@keyframes foe{0%{left:104%;opacity:1;transform:scale(1)}70%{left:36%;opacity:1;transform:scale(1)}74%{left:35.5%;opacity:1;transform:scale(2.2);background:#fff}82%{left:35.5%;opacity:0;transform:scale(3.4)}100%{left:35.5%;opacity:0}}
.shot{width:9px;height:2px;margin-top:-1px;border-radius:2px;background:linear-gradient(90deg,#fff0,#fff);box-shadow:0 0 6px #fff;opacity:0;animation:shot var(--d) linear var(--delay) infinite}
@keyframes shot{0%,61%{left:16%;opacity:0}62%{left:16%;opacity:1}71%{left:35%;opacity:1}72%,100%{left:35%;opacity:0}}
.leak{width:7px;height:7px;margin-top:-3.5px;background:#ff6b5e;box-shadow:0 0 7px #ff3b2e;animation:leak var(--d) linear var(--delay) infinite}
@keyframes leak{0%{left:104%;opacity:1;transform:scale(1)}78%{left:12%;opacity:1;transform:scale(1)}84%{left:11%;opacity:0;transform:scale(3)}100%{left:11%;opacity:0}}

/* MiniCord v2: messages pop in and float up, typing dots, online ping */
.msg{bottom:-20px;width:var(--w);height:16px;border-radius:9px 9px 9px 2px;background:linear-gradient(#ffffff45,#ffffff45) 8px 50%/calc(100% - 16px) 3px no-repeat,#7a56e0;transform-origin:bottom left;opacity:0;animation:msgrise var(--d) ease-out var(--delay) infinite}
.msg.me{border-radius:9px 9px 2px 9px;transform-origin:bottom right;background:linear-gradient(#ffffff45,#ffffff45) 8px 50%/calc(100% - 16px) 3px no-repeat,#5534b2}
@keyframes msgrise{0%{transform:translateY(0) scale(.2);opacity:0}8%{transform:translateY(-10px) scale(1.12);opacity:.75}14%{transform:translateY(-16px) scale(1);opacity:.7}85%{opacity:.45}100%{transform:translateY(-150px) scale(1);opacity:0}}
.tdot{right:var(--x);bottom:16px;width:5px;height:5px;border-radius:50%;background:#b9a3ff;animation:tbounce var(--d) ease-in-out var(--delay) infinite}
@keyframes tbounce{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}
.online{top:14px;right:18px;width:7px;height:7px;border-radius:50%;background:#3ba55d;box-shadow:0 0 6px #3ba55d;animation:ping var(--d) ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 #3ba55daa}70%,100%{box-shadow:0 0 0 9px #3ba55d00}}
@media(prefers-reduced-motion:reduce){
  .fx{display:none}
  .game-card.fx-ember{animation:cardIn .6s cubic-bezier(.22,1,.36,1) both}
}
</style>
</head>

<div class="corner corner-tl"></div>

    name:  'Roguelike',
    tag:   'Its back?',
    desc:  'ouu shi',
    url:   'https://inf-specially-pattern-terminals.trycloudflare.com',
    color: '#8B0000',
    disabled: false,
    reason: 'working on huge update freeroam maybe? :D',
    fx:    'ember',
  },
  {
    name:  'HAKARIS DREAM',
    tag:   'Jackpot',
    desc:  'Feeling lucky?',
    url:   'https://chanceywancey.github.io/CIRCULATE/JACKPOT.html',
    color: '#00c853',
    disabled: false,
    reason: '',
    fx:    'sparkle',
  },
];
// ── Don't touch anything below this line ──
const list = document.getElementById('gameList');
const search = document.getElementById('gameSearch');
const searchCount = document.getElementById('searchCount');

function addSparkles(card, count = 16) {
  for (let i = 0; i < count; i++) {
    const s = document.createElement('span');
    s.className = 'sparkle';
    s.textContent = '✦';
    s.style.cssText = [
      `--x:${(Math.random() * 94 + 2).toFixed(1)}%`,
      `--y:${(Math.random() * 88 + 4).toFixed(1)}%`,
      `--s:${Math.round(Math.random() * 10 + 7)}px`,
      `--d:${(Math.random() * 1.6 + 1.4).toFixed(2)}s`,
      `--delay:${(Math.random() * 3).toFixed(2)}s`,
    ].join(';');
    card.appendChild(s);
  }
}

const R = (a, b) => Math.random() * (b - a) + a;
function mk(card, cls, vars) {
  const el = document.createElement('span');
  el.className = 'fx ' + cls;
  el.style.cssText = Object.entries(vars || {}).map(([k, v]) => `${k}:${v}`).join(';');
  card.appendChild(el);
}
const FX = {
  sparkle: addSparkles,
  orbit(c) {
    [[20, 2.4], [28, 3.4], [36, 4.6]].forEach(([r, d]) =>
      [0, .5].forEach(p => mk(c, 'orb', { '--r': r + 'px', '--d': d + 's', '--delay': (-d * p) + 's' })));
    for (let i = 0; i < 5; i++) mk(c, 'bul', { top: R(10, 90) + '%', '--d': R(2.2, 4) + 's', '--delay': -R(0, 4) + 's' });
  },
  defend(c) {
    mk(c, 'tdline');
    [22, 42, 62, 82].forEach((y, i) => {
      const v = { top: y + '%', '--d': (3.4 + i * .35).toFixed(2) + 's', '--delay': (-i * 0.9).toFixed(2) + 's' };
      mk(c, 'twr', { top: y + '%', '--d': v['--d'], '--delay': v['--delay'] });
      mk(c, 'foe', v);
      mk(c, 'shot', v);
    });
    mk(c, 'leak', { top: '52%', '--d': '5.2s', '--delay': '-1.5s' });
  },
  chat(c) {
    for (let i = 0; i < 7; i++) mk(c, 'msg' + (i % 2 ? ' me' : ''), { left: R(4, 90) + '%', '--w': R(28, 56) + 'px', '--d': R(3.4, 5.2) + 's', '--delay': -R(0, 5) + 's' });
    [0, 1, 2].forEach(i => mk(c, 'tdot', { '--x': (88 - i * 9) + 'px', '--d': '1.2s', '--delay': (i * .15) + 's' }));
    mk(c, 'online', { '--d': '2s' });
  },
  tube(c) {
    mk(c, 'tbar');
    [0, .5].forEach(p => mk(c, 'trip', { '--d': '2.4s', '--delay': (-2.4 * p) + 's' }));
  },
  space(c) {
    for (let i = 0; i < 22; i++) mk(c, 'star', { top: R(4, 96) + '%', '--z': R(1, 2.6) + 'px', '--d': R(3, 9) + 's', '--delay': -R(0, 9) + 's' });
    mk(c, 'shoot', { top: R(5, 35) + '%', left: R(55, 90) + '%', '--delay': R(0, 3) + 's' });
  },
  ember(c) {
    for (let i = 0; i < 14; i++) mk(c, 'emb', { left: R(2, 96) + '%', '--sx': R(-25, 25) + 'px', '--d': R(2, 4) + 's', '--delay': -R(0, 4) + 's' });
  },
};

function renderGames(query = '') {
  list.innerHTML = '';

  const term = query.trim().toLowerCase();

  const matches = GAMES.filter(g => {
    if (!term) return true;

    return [
      g.name,
      g.tag,
      g.desc,
      g.reason,
      g.disabled ? 'locked' : 'available'
    ].some(value => String(value || '').toLowerCase().includes(term));
  });

  matches.forEach((g, matchIndex) => {
    const originalIndex = GAMES.indexOf(g);
    const num = String(originalIndex + 1).padStart(2, '0');
    const isDisabled = !!g.disabled;

    const a = document.createElement('a');
    a.className = 'game-card' + (isDisabled ? ' is-disabled' : '') + (g.fx ? ' fx-' + g.fx : '') + (g.fx === 'sparkle' ? ' is-sparkle' : '');
    a.href = isDisabled ? '#' : g.url;

    if (!isDisabled) a.target = '_blank';

    if (isDisabled) {
      a.setAttribute('aria-disabled', 'true');
      a.addEventListener('click', e => e.preventDefault());
    }

    a.style.cssText = [
      `--card-color:${g.color}`,
      `--card-glow:linear-gradient(135deg,${g.color}08,transparent)`,
      `--card-border:${g.color}55`,
      `animation-delay:${0.05 + matchIndex * 0.06}s`,
    ].join(';');

    a.innerHTML = `
      <div class="scanline"></div>
      <div class="card-inner">
        <div class="card-left">
          <span class="card-num">${num} — ${g.tag}${isDisabled ? ' — LOCKED' : ''}</span>
          <span class="card-name">${g.name}</span>
          <span class="card-desc">${g.desc}</span>
          ${isDisabled && g.reason ? `<span class="card-reason">⚠ ${g.reason}</span>` : ''}
        </div>
        <span class="card-arrow${isDisabled ? ' is-locked' : ''}">${isDisabled ? '🔒' : '↗'}</span>
      </div>`;

    if (g.fx && FX[g.fx]) FX[g.fx](a);

    list.appendChild(a);
  });

  if (matches.length === 0) {
    list.innerHTML = '<div class="no-results">No games found</div>';
  }

  searchCount.textContent = term
    ? `${matches.length} result${matches.length === 1 ? '' : 's'}`
    : `${GAMES.length} games`;
}

search.addEventListener('input', () => renderGames(search.value));
renderGames();
</script>
</body>
</html>
